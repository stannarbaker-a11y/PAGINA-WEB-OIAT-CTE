<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Pericial</title>
<style>
:root{--nv:#0a2a66;--ac:#0b4fb3;--card:#f1f5fb;--tx:#12213f;--mu:#5b6b8c;--ms:#E1AD01}
*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#fff;color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
header{height:240px;background:linear-gradient(#0004,#0a2a66cc),url(header.jpg) center 60%/cover;position:relative;display:flex;align-items:flex-end;padding:16px 20px;color:#fff}
header h1{margin:0;font-size:clamp(1.4rem,4vw,2.4rem);text-shadow:0 2px 8px #000}
#burger{position:absolute;top:14px;left:14px;background:var(--ms);border:0;border-radius:8px;font-size:1.5rem;padding:6px 12px;cursor:pointer}
#vis{position:absolute;top:14px;right:14px;background:#fffd;color:var(--tx);padding:6px 12px;border-radius:20px}
#hdrbtn{position:absolute;top:58px;right:14px}
#ov{display:none;position:fixed;inset:0;background:#0007;z-index:19}
#drawer{position:fixed;top:0;left:-300px;width:280px;height:100%;background:#fff;padding:14px;transition:.3s;z-index:20;overflow:auto;border-right:3px solid var(--ms);box-shadow:4px 0 16px #0003}
#drawer.open{left:0}#closeD{width:100%;background:var(--nv);color:#fff;border:0;border-radius:8px;padding:10px;font-size:1rem;cursor:pointer;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--nv);color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:1rem;text-decoration:none}
.btn:hover{background:var(--ac)}.btn.sm{padding:7px 12px;font-size:.85rem;background:#fff;color:var(--nv);border:1.5px solid var(--nv)}.btn.sm:hover{background:var(--nv);color:#fff}
#drawer .btn{display:flex;width:100%;margin:6px 0}
main{flex:1;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px}
#row3{display:flex;gap:.6cm;flex-wrap:wrap;justify-content:center}
.blk{width:9cm;max-width:100%;height:12cm;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid #cdd8ea;display:flex;flex-direction:column;position:relative}
.lb{height:.8cm;flex:none;background:var(--nv);color:#fff;text-align:center;line-height:.8cm;font-weight:700;font-size:.85rem}
.g4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.3cm;padding:.3cm}
.ph{background:#dfe7f4 center/cover no-repeat;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:.75rem;text-align:center}
.ph.has{font-size:0}#big{flex:1;border-radius:0}
#car{flex:1;position:relative;background:#dfe7f4}.sl{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .6s}.sl.on{opacity:1}
#carph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:.8rem;text-align:center}
.adm{display:none;position:absolute;bottom:.9cm;left:6px;gap:6px;z-index:2}.edit .adm{display:flex}
.rowb{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:1100px}
h2{margin:0;color:var(--nv)}
.edit .ph,.edit .btn,.edit .lb,.edit h2,.edit #q,.edit footer button{outline:2px dashed var(--ms);cursor:pointer}
footer{height:3cm;flex:none;background:var(--nv);border-top:2mm solid var(--ms);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 90px 0 24px}
#soc{display:flex;flex-direction:column;justify-content:center}.sr{display:flex;align-items:center;gap:8px;height:.9cm;font-size:.9rem}
.ic{width:.65cm;height:.65cm;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.sr b{min-width:78px}.sr button{background:var(--ms);color:#1b1b1b;border:0;border-radius:6px;padding:2px 10px;font-size:.75rem;cursor:pointer}
#q{margin:0;max-width:430px;text-align:right;font-style:italic;font-size:clamp(.8rem,1.6vw,1.05rem)}
#editbtn{position:fixed;right:10px;bottom:10px;font-size:.7rem;padding:6px 10px;background:var(--ms);color:#111;border:0;border-radius:6px;cursor:pointer;z-index:10;font-weight:700}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30}
.modal>div{background:#fff;padding:22px;border-radius:12px;width:min(340px,92vw)}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #b9c6de;font:inherit}
.link{color:var(--ac);cursor:pointer;font-size:.8rem}
@media(max-width:640px){footer{padding:0 12px;height:auto;min-height:3cm;flex-direction:column;padding-bottom:50px}#q{text-align:center}}
</style></head><body>
<header id="hdr"><button id="burger">☰</button><div id="vis">👁 <span id="vn">0</span></div><button id="hdrbtn" class="btn adm" style="position:absolute;bottom:auto;left:auto;top:58px;right:14px">📷 Cambiar fondo</button><h1 data-k="title" data-e>Portal de Servicios Periciales</h1></header>
<div id="ov"></div><aside id="drawer"><button id="closeD">✕ Cerrar menú</button><div id="dl"></div></aside>
<main>
<div id="row3">
 <div class="blk"><div class="g4"><div class="ph" data-img="s1">Foto</div><div class="ph" data-img="s2">Foto</div><div class="ph" data-img="s3">Foto</div><div class="ph" data-img="s4">Foto</div></div><div class="lb" data-k="l2" data-e>Peritos Destacados</div></div>
 <div class="blk"><div id="car"><div id="slides"></div><div id="carph">Fotos de diligencias periciales</div><div class="adm"><button class="btn sm" id="cadd">➕ Foto</button><button class="btn sm" id="cdel">🗑 Quitar</button></div></div><div class="lb" data-k="l3" data-e>Diligencias Periciales</div></div>
 <div class="blk"><div class="ph" id="big" data-img="big">Foto principal</div><div class="lb" data-k="l1" data-e>Excelencia Pericial del Mes</div></div>
</div>
<h2 data-k="h2" data-e>Servicios Periciales</h2>
<div class="rowb" id="mainbtns"></div>
<div class="rowb" id="smallbtns"></div>
</main>
<footer><div id="soc">
<div class="sr"><span class="ic" style="background:#000">𝕏</span><b>X</b><button data-soc="x">Abrir</button></div>
<div class="sr"><span class="ic" style="background:#25d366">✆</span><b>WhatsApp</b><button data-soc="wa">Abrir</button></div>
<div class="sr"><span class="ic" style="background:#ea4335">M</span><b>Gmail</b><button data-soc="mail">Escribir</button></div></div>
<p id="q" data-k="quote" data-e></p></footer>
<button id="editbtn">EDIT</button>
<div class="modal" id="login"><div><h3>Acceso administrador</h3><input id="u" placeholder="Usuario"><input id="p" type="password" placeholder="Contraseña"><button class="btn" id="go" style="width:100%;justify-content:center">Entrar</button><p><span class="link" id="forgot">Olvidé mi contraseña</span> · <span class="link" id="cancel">Cancelar</span></p></div></div>
<div class="modal" id="cm"><div><h3>Escríbenos</h3><input id="ce" type="email" placeholder="Tu correo"><textarea id="cmsg" rows="5" placeholder="Tu mensaje"></textarea><input id="hp" style="display:none" tabindex="-1" autocomplete="off"><button class="btn" id="send" style="width:100%;justify-content:center">Enviar</button><p><span class="link" id="ccancel">Cancelar</span></p></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
let TOKEN=sessionStorage.getItem("tk")||"",admin=false,target,ci=0,sv;const $=s=>document.querySelector(s);
const D={title:"Portal de Servicios Periciales",l1:"Excelencia Pericial del Mes",l2:"Peritos Destacados",l3:"Diligencias Periciales",h2:"Servicios Periciales",quote:"Perito: buscador de la verdad, amigo de las ciencias y bendecido por El Todopoderoso",
main:[["🔍","Consultas de Pericias","#"],["📚","Biblioteca","#"],["✉️","Contactos","#"],["📊","Estadística / Siniestralidad","#"],["➕","Otros","#"]],
small:[["🏛️","Jefaturas Provinciales","#"],["🧑‍⚕️","Personas Siniestradas","#"],["📰","Noticias","#"],["⛅","Consultar Clima","#"],["🚗","ANT","#"],["🛡️","CTE","#"]],img:{},car:[],soc:{x:"",wa:""}};
let S=JSON.parse(JSON.stringify(D));
function fix(){["ANT","CTE"].forEach((n,i)=>{if(!S.small.some(b=>b[1]==n))S.small.push(D.small[4+i])});S.img=S.img||{};S.car=S.car||[];S.soc=S.soc||{x:"",wa:""}}
const save=()=>{clearTimeout(sv);sv=setTimeout(async()=>{try{const r=await fetch("/api/state",{method:"POST",headers:{Authorization:"Bearer "+TOKEN},body:JSON.stringify(S)});if(r.status==401){alert("Sesión vencida. Pulsa EDIT y entra de nuevo");setAdmin(false)}else if(!r.ok)alert("No se pudo guardar")}catch(e){alert("Sin conexión: no se guardó")}},400)};
function render(){
 document.querySelectorAll("[data-k]").forEach(e=>{if(document.activeElement!==e)e.textContent=S[e.dataset.k]});
 const mk=(a,c)=>a.map((b,i)=>`<a class="btn ${c}" data-i="${i}" data-c="${c}" href="${b[2]}" ${b[2]=="#"?"":'target="_blank" rel="noopener"'}><span>${b[0]}</span><span>${b[1]}</span></a>`).join("");
 $("#mainbtns").innerHTML=mk(S.main,"");$("#smallbtns").innerHTML=mk(S.small,"sm");$("#dl").innerHTML=mk(S.main,"")+mk(S.small,"sm");
 document.querySelectorAll("[data-img]").forEach(e=>{const u=S.img[e.dataset.img];e.style.backgroundImage=u?`url(${u})`:"";e.classList.toggle("has",!!u)});
 if(S.img.hdr)$("#hdr").style.backgroundImage=`linear-gradient(#0004,#0a2a66cc),url(${S.img.hdr})`;
 if(ci>=S.car.length)ci=0;
 $("#slides").innerHTML=S.car.map((u,i)=>`<div class="sl${i==ci?" on":""}" style="background-image:url(${u})"></div>`).join("");$("#carph").style.display=S.car.length?"none":"flex";
}
setInterval(()=>{if(S.car.length>1){ci=(ci+1)%S.car.length;document.querySelectorAll(".sl").forEach((e,i)=>e.classList.toggle("on",i==ci))}},3000);
const od=v=>{$("#drawer").classList.toggle("open",v);$("#ov").style.display=v?"block":"none"};
$("#burger").onclick=()=>od(true);$("#closeD").onclick=()=>od(false);$("#ov").onclick=()=>od(false);
document.addEventListener("click",e=>{if(!admin)return;
 const b=e.target.closest(".btn[data-i]");
 if(b){e.preventDefault();const a=b.dataset.c?S.small:S.main,i=b.dataset.i;const t=prompt("Texto del botón:",a[i][1]);if(t===null)return;const ic=prompt("Icono (emoji):",a[i][0]);const l=prompt("Enlace (https://...):",a[i][2]);a[i]=[ic||a[i][0],t,l||"#"];save();render();return}
 const p=e.target.closest("[data-img]");if(p){target=p.dataset.img;$("#file").click()}});
$("#hdrbtn").onclick=()=>{target="hdr";$("#file").click()};
$("#cadd").onclick=e=>{e.stopPropagation();if(S.car.length>=30)return alert("Máximo 30 fotos");target="car";$("#file").click()};
$("#cdel").onclick=e=>{e.stopPropagation();if(!S.car.length)return;if(confirm("¿Quitar la foto que se muestra?")){S.car.splice(ci,1);save();render()}};
$("#file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const t=target,r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{
 const c=document.createElement("canvas"),s=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 const b=c.toDataURL("image/jpeg",.75).split(",")[1],id=t+"-"+Date.now();
 try{const x=await fetch("/api/img?id="+id,{method:"POST",headers:{Authorization:"Bearer "+TOKEN},body:b});if(!x.ok)throw 0;const u="/api/img?id="+id;if(t=="car")S.car.push(u);else S.img[t]=u;save();render()}catch(_){alert("No se pudo subir la foto. Pulsa EDIT y entra de nuevo")}};im.src=r.result};r.readAsDataURL(f)};
function setAdmin(v){admin=v;document.body.classList.toggle("edit",v);$("#editbtn").textContent=v?"SALIR":"EDIT";
 document.querySelectorAll("[data-e]").forEach(e=>{e.contentEditable=v;e.onblur=()=>{S[e.dataset.k]=e.textContent;save()}})}
$("#editbtn").onclick=()=>admin?setAdmin(false):$("#login").style.display="flex";
$("#cancel").onclick=()=>$("#login").style.display="none";
$("#go").onclick=async()=>{try{const r=await fetch("/api/login",{method:"POST",body:JSON.stringify({u:$("#u").value,p:$("#p").value})});if(!r.ok)return alert("Usuario o contraseña incorrectos");TOKEN=(await r.json()).token;sessionStorage.setItem("tk",TOKEN);$("#login").style.display="none";$("#p").value="";setAdmin(true)}catch(e){alert("Sin conexión con el servidor")}};
$("#forgot").onclick=async()=>{try{const r=await fetch("/api/reset",{method:"POST"});alert(r.ok?"Enviamos una contraseña temporal a stannarbaker@gmail.com":r.status==429?"Espera 10 minutos antes de pedir otra":"No se pudo enviar el correo")}catch(e){alert("Sin conexión")}};
document.querySelectorAll("[data-soc]").forEach(b=>b.onclick=()=>{const k=b.dataset.soc;
 if(k=="mail"){$("#cm").style.display="flex";return}
 if(admin){const l=prompt("Enlace de "+(k=="x"?"X":"WhatsApp")+" (https://...):",S.soc[k]||"");if(l!==null){S.soc[k]=l.trim();save()}return}
 S.soc[k]?window.open(S.soc[k],"_blank","noopener"):alert("Enlace no configurado aún")});
$("#ccancel").onclick=()=>$("#cm").style.display="none";
$("#send").onclick=async()=>{try{const r=await fetch("/api/contact",{method:"POST",body:JSON.stringify({email:$("#ce").value,msg:$("#cmsg").value,hp:$("#hp").value})});
 alert(r.ok?"Mensaje enviado. ¡Gracias!":r.status==429?"Espera unos segundos e intenta de nuevo":"Revisa tu correo y escribe un mensaje de al menos 5 letras");if(r.ok){$("#cm").style.display="none";$("#cmsg").value=""}}catch(e){alert("Sin conexión")}};
fetch("/api/visits",{method:sessionStorage.getItem("seen")?"GET":"POST"}).then(r=>r.json()).then(j=>{$("#vn").textContent=j.n;sessionStorage.setItem("seen",1)}).catch(()=>{});
render();
fetch("/api/state").then(r=>r.json()).then(j=>{S=Object.assign(S,j);fix();render()}).catch(()=>{});
</script></body></html>
